name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Create config.js from repository secret
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          if [ -z "$OPENWEATHER_API_KEY" ]; then
            echo "OPENWEATHER_API_KEY repository secret is missing."
            exit 1
          fi
          node -e 'require("fs").writeFileSync("config.js", "const API_KEY = " + JSON.stringify(process.env.OPENWEATHER_API_KEY) + ";")'

      - name: Stage website files
        run: |
          mkdir -p _site
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '_site' -exec cp -a {} _site/ \;
          test -s _site/config.js || (echo "config.js was not copied into the deployment folder." && exit 1)
          test -s _site/index.html || (echo "index.html is missing from the deployment folder." && exit 1)
          echo "Deployment folder contains config.js and index.html."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
