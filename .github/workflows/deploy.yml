
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Create config.js from repository secret
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          if [ -z "$OPENWEATHER_API_KEY" ]; then
            echo "OPENWEATHER_API_KEY repository secret is missing."
            exit 1
          fi

          node -e 'require("fs").writeFileSync("config.js", "const API_KEY = " + JSON.stringify(process.env.OPENWEATHER_API_KEY) + ";")'

      - name: Verify deployment files
        run: |
          test -s config.js || (echo "config.js is missing!" && exit 1)
          test -s index.html || (echo "index.html is missing!" && exit 1)
          echo "Required deployment files are present."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
